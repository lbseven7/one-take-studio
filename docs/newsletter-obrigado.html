<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscrição confirmada · Take Um Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=optional" rel="stylesheet">
<style>
  :root{
    --bg: #0a0a0c;
    --panel: #141417;
    --panel-line: #232328;
    --text-main: #f5f4ef;
    --text-dim: #8a8a92;
    --accent-amber: #ffb020;
    --accent-green: #39ff88;
    --font-display: 'Archivo', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }
  #app{
    max-width: 520px;
    margin: 0 auto;
    padding: 56px 24px;
    text-align: center;
  }
  .mark{
    width: 64px; height: 64px;
    border-radius: 14px;
    object-fit: cover;
    margin: 0 auto 22px auto;
    display: block;
  }
  h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    margin: 0 0 12px 0;
    letter-spacing: -0.02em;
  }
  p{
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 10px 0;
  }
  p strong{ color: var(--accent-green); font-weight: 600; }
  .btn{
    display: inline-block;
    margin-top: 22px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: #1a1200;
    background: var(--accent-amber);
    border-radius: 8px;
    padding: 13px 28px;
    text-decoration: none;
  }
  .btn:hover{ filter: brightness(1.08); }
</style>
</head>
<body>

<div id="app">
  <img class="mark" src="icons/icon-192.png" alt="Take Um Studio">
  <h1>Inscrição confirmada!</h1>
  <p>Boa escolha. A partir de agora você recebe <strong>1 dica por semana</strong> pra gravar melhor.</p>
  <p>Pra garantir a entrega, confirme o e-mail de ativação que acabamos de enviar.</p>
  <a class="btn" href="index.html">Voltar ao estúdio</a>
</div>

</body>
</html>
