name = "takeum-pro-keys"
main = "src/index.js"
compatibility_date = "2025-01-01"

# KV para guardar as chaves geradas
[[kv_namespaces]]
binding = "KEYS"
id = "SUBSTITUA_PELO_ID_DO_NAMESPACE_KV"

# Variáveis de ambiente (não sensíveis)
[vars]
EMAIL_FROM = "Take Um Studio <no-reply@seudominio.com.br>"

# Secrets (crie com: npx wrangler secret put NOME, ou no dashboard > Settings > Variables)
#   STRIPE_WEBHOOK_SECRET  -> whsec_...  (Stripe > Developers > Webhooks)
#   RESEND_API_KEY         -> re_...     (Resend > API Keys)
