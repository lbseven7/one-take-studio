<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Inscrição confirmada · Take Um Studio</title>
<link rel="stylesheet" href="fonts.css">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg: #0d0c0a;
    --panel: #16140f;
    --panel-line: #262219;
    --text-main: #f7f4ec;
    --text-dim: #9c968a;
    --accent-amber: #ffb020;
    --accent-green: #4dff99;
    --font-display: 'Archivo', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; padding: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }
  #app{
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 24px;
    text-align: center;
  }
  .mark{
    width: 110px; height: 110px;
    border-radius: 22px;
    object-fit: contain;
    margin: 0 auto 22px auto;
    display: block;
  }
  h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    margin: 0 0 12px 0;
    letter-spacing: -0.02em;
  }
  p{
    color: var(--text-dim);
    font-size: 14px;
    line-height: 1.7;
    margin: 0 0 10px 0;
  }
  p strong{ color: var(--accent-green); font-weight: 600; }
  .btn{
    display: inline-block;
    margin-top: 22px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: #1a1200;
    background: var(--accent-amber);
    border-radius: 8px;
    padding: 13px 28px;
    text-decoration: none;
  }
  .btn:hover{ filter: brightness(1.08); }
</style>
<script src="analytics.js"></script>
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="theme.css">
<script src="back-btn.js" defer></script>
<script src="theme.js"></script>
</head>
<body>

<div id="app">
  <img class="mark" src="image/nova-image-perfil.png" alt="Take Um">
  <h1>Inscrição confirmada!</h1>
  <p>Boa escolha. A partir de agora você recebe <strong>1 dica por semana</strong> pra gravar melhor.</p>
  <p>Pra garantir a entrega, confirme o e-mail de ativação que acabamos de enviar.</p>
  <a class="btn" href="index.html">Voltar ao estúdio</a>
</div>

<script>
  if(window.tuTrack){ window.tuTrack('newsletter_signup'); }
</script>
</body>
</html>
