name: Deploy site

on:
  push:
    branches: [master, new-feat]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./one-take-studio
          destination_dir: docs
          enable_jekyll: false
