<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Take Um Studio · Painel de Pauta</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  :root{
    --bg: #0a0a0c;
    --panel: #141417;
    --panel-line: #232328;
    --card: #1a1a1e;
    --text-main: #f5f4ef;
    --text-dim: #8a8a92;
    --accent-amber: #ffb020;
    --accent-red: #ff3b30;
    --accent-green: #39ff88;
    --accent-blue: #5aa9ff;
    --font-display: 'Archivo', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }

  #app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- TOP BAR ---------- */
  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
    gap: 12px;
  }
  header h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 18px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .count{
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  #add-btn{
    background: var(--accent-amber);
    color: #1a1200;
    border: none;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 10px 16px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  #add-btn:hover{ filter: brightness(1.1); }

  /* ---------- BOARD ---------- */
  #board{
    flex: 1;
    display: flex;
    gap: 14px;
    padding: 16px;
    overflow-x: auto;
    overflow-y: hidden;
  }

  .column{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    width: 260px;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .column-head{
    padding: 12px 14px;
    border-bottom: 1px solid var(--panel-line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .column-head .dot{
    width: 8px; height: 8px; border-radius: 50%;
    display: inline-block;
    margin-right: 8px;
  }
  .column-head .title{
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    display: flex;
    align-items: center;
  }
  .column-head .n{
    color: var(--text-dim);
    font-size: 11px;
  }

  .column-body{
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .empty-hint{
    color: var(--text-dim);
    font-size: 11px;
    text-align: center;
    padding: 20px 8px;
    line-height: 1.6;
    opacity: 0.7;
  }

  /* ---------- CARD ---------- */
  .card{
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
    transition: border-color .15s ease;
  }
  .card:hover{ border-color: var(--accent-amber); }

  .card .platform{
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    margin-bottom: 8px;
    color: #1a1200;
    font-weight: 600;
  }
  .card .title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    line-height: 1.35;
    margin-bottom: 6px;
    word-break: break-word;
  }
  .card .notes{
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .footer{
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid var(--panel-line);
  }
  .card .arrows{ display: flex; gap: 4px; }
  .card .arrows button{
    background: none;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    width: 24px; height: 24px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .card .arrows button:hover{ color: var(--accent-amber); border-color: var(--accent-amber); }
  .card .arrows button:disabled{ opacity: 0.25; cursor: default; }
  .card .arrows button:disabled:hover{ color: var(--text-dim); border-color: var(--panel-line); }

  .card .del-btn{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
  }
  .card .del-btn:hover{ color: var(--accent-red); }

  /* ---------- MODAL ---------- */
  #modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(6,6,8,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  #modal-backdrop.show{ display: flex; }

  #modal{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    width: 100%;
    max-width: 440px;
    padding: 22px;
    max-height: 90vh;
    overflow-y: auto;
  }
  #modal h2{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 18px;
    margin: 0 0 18px 0;
  }
  .modal-field{
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .modal-field label{
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .modal-field input[type=text], .modal-field textarea, .modal-field select{
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    color: var(--text-main);
    font-family: var(--font-display);
    font-size: 15px;
    padding: 10px 12px;
    outline: none;
    font-weight: 500;
  }
  .modal-field select{ font-family: var(--font-mono); font-size: 13px; }
  .modal-field input[type=text]:focus, .modal-field textarea:focus, .modal-field select:focus{
    border-color: var(--accent-amber);
  }
  .modal-field textarea{ min-height: 90px; resize: vertical; line-height: 1.5; }

  .platform-picker{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .platform-chip{
    border: 1px solid var(--panel-line);
    background: var(--card);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 7px 12px;
    border-radius: 20px;
    cursor: pointer;
  }
  .platform-chip.active{
    border-color: transparent;
    color: #1a1200;
    font-weight: 600;
  }

  .modal-actions{
    display: flex;
    gap: 10px;
    margin-top: 6px;
    justify-content: flex-end;
  }
  .modal-actions button{
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 11px 18px;
    border-radius: 4px;
    cursor: pointer;
  }
  #cancel-btn{
    background: transparent;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
  }
  #cancel-btn:hover{ color: var(--text-main); }
  #save-btn{
    background: var(--accent-amber);
    border: none;
    color: #1a1200;
    font-weight: 600;
  }
  #save-btn:hover{ filter: brightness(1.1); }

  #delete-from-modal{
    background: transparent;
    border: none;
    color: var(--accent-red);
    margin-right: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 11px 4px;
    display: none;
  }

  @media (max-width: 640px){
    header h1{ font-size: 15px; }
    .column{ width: 82vw; min-width: 82vw; }
  }
</style>
<link rel="stylesheet" href="../mobile.css">
</head>
<body>

<div id="app">
  <header>
    <div>
      <h1>Take Um Studio · Painel de Pauta</h1>
      <div class="count" id="total-count">0 ideias</div>
    </div>
    <button id="add-btn">+ Nova ideia</button>
  </header>

  <div id="board"></div>
</div>

<!-- MODAL -->
<div id="modal-backdrop">
  <div id="modal">
    <h2 id="modal-title">Nova ideia</h2>

    <div class="modal-field">
      <label>Título</label>
      <input type="text" id="field-title" placeholder="Ex: 5 erros que todo iniciante comete">
    </div>

    <div class="modal-field">
      <label>Plataforma</label>
      <div class="platform-picker" id="platform-picker"></div>
    </div>

    <div class="modal-field">
      <label>Roteiro / notas</label>
      <textarea id="field-notes" placeholder="Ideias, roteiro, ganchos, referências..."></textarea>
    </div>

    <div class="modal-field">
      <label>Status</label>
      <select id="field-status"></select>
    </div>

    <div class="modal-actions">
      <button id="delete-from-modal">Excluir</button>
      <button id="cancel-btn">Cancelar</button>
      <button id="save-btn">Salvar</button>
    </div>
  </div>
</div>

<script src="../db.js"></script>
<script>
(function(){

  const COLUMNS = [
    { id: 'ideia',    label: 'Ideia',        color: '#8a8a92' },
    { id: 'roteiro',  label: 'Roteiro pronto', color: 'var(--accent-blue)' },
    { id: 'gravado',  label: 'Gravado',      color: 'var(--accent-amber)' },
    { id: 'editado',  label: 'Editado',      color: '#c084fc' },
    { id: 'postado',  label: 'Postado',      color: 'var(--accent-green)' }
  ];

  const PLATFORMS = [
    { id: 'reels',   label: 'Reels',    color: '#ff5c8a' },
    { id: 'tiktok',  label: 'TikTok',   color: '#39e6e6' },
    { id: 'youtube', label: 'YouTube',  color: '#ff4d4d' },
    { id: 'shorts',  label: 'Shorts',   color: '#ff3b30' },
    { id: 'outro',   label: 'Outro',    color: '#8a8a92' }
  ];

  const board = document.getElementById('board');
  const totalCount = document.getElementById('total-count');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalTitle = document.getElementById('modal-title');
  const fieldTitle = document.getElementById('field-title');
  const fieldNotes = document.getElementById('field-notes');
  const fieldStatus = document.getElementById('field-status');
  const platformPicker = document.getElementById('platform-picker');
  const addBtn = document.getElementById('add-btn');
  const cancelBtn = document.getElementById('cancel-btn');
  const saveBtn = document.getElementById('save-btn');
  const deleteFromModal = document.getElementById('delete-from-modal');

  let cards = [];
  let editingId = null;
  let selectedPlatform = 'reels';

  async function loadCards(){
    try{
      cards = await OneTakeDB.getAll('pauta_cards') || [];
      if(cards.length === 0 && !localStorage.getItem('tu-pauta-seeded')){
        const seed = { id: uid(), title: 'Bastidores da rotina de gravação', platform: 'reels', notes: 'Mostrar setup, teleprompter, luz. Gancho: "isso mudou minha forma de gravar".', status: 'ideia', createdAt: Date.now() };
        cards.push(seed);
        await OneTakeDB.put('pauta_cards', seed);
        localStorage.setItem('tu-pauta-seeded', '1');
      }
    }catch(e){
      cards = [];
    }
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function platformInfo(id){
    return PLATFORMS.find(p => p.id === id) || PLATFORMS[PLATFORMS.length - 1];
  }

  function render(){
    board.innerHTML = '';
    totalCount.textContent = cards.length + (cards.length === 1 ? ' ideia' : ' ideias');

    COLUMNS.forEach((col, colIndex) => {
      const colEl = document.createElement('div');
      colEl.className = 'column';

      const colCards = cards.filter(c => c.status === col.id);

      colEl.innerHTML = `
        <div class="column-head">
          <span class="title"><span class="dot" style="background:${col.color}"></span>${col.label}</span>
          <span class="n">${colCards.length}</span>
        </div>
        <div class="column-body" id="col-${col.id}"></div>
      `;
      board.appendChild(colEl);

      const body = colEl.querySelector('.column-body');

      if(colCards.length === 0){
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = col.id === 'ideia' ? 'Toque em "+ Nova ideia" para começar' : 'Nenhum card aqui ainda';
        body.appendChild(hint);
        return;
      }

      colCards.forEach(card => {
        body.appendChild(renderCard(card, colIndex));
      });
    });
  }

  function renderCard(card, colIndex){
    const el = document.createElement('div');
    el.className = 'card';
    const p = platformInfo(card.platform);
    const isFirst = colIndex === 0;
    const isLast = colIndex === COLUMNS.length - 1;

    el.innerHTML = `
      <span class="platform" style="background:${p.color}">${p.label}</span>
      <div class="title"></div>
      ${card.notes ? '<div class="notes"></div>' : ''}
      <div class="footer">
        <div class="arrows">
          <button class="move-left" ${isFirst ? 'disabled' : ''} title="Voltar etapa">‹</button>
          <button class="move-right" ${isLast ? 'disabled' : ''} title="Avançar etapa">›</button>
        </div>
        <button class="del-btn" title="Excluir">✕</button>
      </div>
    `;

    el.querySelector('.title').textContent = card.title;
    if(card.notes) el.querySelector('.notes').textContent = card.notes;

    el.addEventListener('click', (e) => {
      if(e.target.closest('.arrows') || e.target.closest('.del-btn')) return;
      openModal(card);
    });

    el.querySelector('.move-left').addEventListener('click', (e) => {
      e.stopPropagation();
      moveCard(card.id, -1);
    });
    el.querySelector('.move-right').addEventListener('click', (e) => {
      e.stopPropagation();
      moveCard(card.id, 1);
    });
    el.querySelector('.del-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteCard(card.id);
    });

    return el;
  }

  function moveCard(id, dir){
    const card = cards.find(c => c.id === id);
    if(!card) return;
    const idx = COLUMNS.findIndex(c => c.id === card.status);
    const newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= COLUMNS.length) return;
    card.status = COLUMNS[newIdx].id;
    OneTakeDB.put('pauta_cards', card);
    render();
  }

  function deleteCard(id){
    cards = cards.filter(c => c.id !== id);
    OneTakeDB.del('pauta_cards', id);
    render();
  }

  // ---------- MODAL ----------
  function buildStatusOptions(){
    fieldStatus.innerHTML = '';
    COLUMNS.forEach(col => {
      const opt = document.createElement('option');
      opt.value = col.id;
      opt.textContent = col.label;
      fieldStatus.appendChild(opt);
    });
  }

  function buildPlatformPicker(){
    platformPicker.innerHTML = '';
    PLATFORMS.forEach(p => {
      const chip = document.createElement('div');
      chip.className = 'platform-chip';
      chip.textContent = p.label;
      chip.dataset.id = p.id;
      chip.addEventListener('click', () => {
        selectedPlatform = p.id;
        refreshPlatformChips();
      });
      platformPicker.appendChild(chip);
    });
    refreshPlatformChips();
  }

  function refreshPlatformChips(){
    [...platformPicker.children].forEach(chip => {
      const active = chip.dataset.id === selectedPlatform;
      chip.classList.toggle('active', active);
      chip.style.background = active ? platformInfo(chip.dataset.id).color : '';
    });
  }

  function openModal(card){
    editingId = card ? card.id : null;
    modalTitle.textContent = card ? 'Editar ideia' : 'Nova ideia';
    fieldTitle.value = card ? card.title : '';
    fieldNotes.value = card ? card.notes || '' : '';
    fieldStatus.value = card ? card.status : 'ideia';
    selectedPlatform = card ? card.platform : 'reels';
    deleteFromModal.style.display = card ? 'block' : 'none';
    refreshPlatformChips();
    modalBackdrop.classList.add('show');
    setTimeout(() => fieldTitle.focus(), 50);
  }

  function closeModal(){
    modalBackdrop.classList.remove('show');
    editingId = null;
  }

  addBtn.addEventListener('click', () => openModal(null));
  cancelBtn.addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => { if(e.target === modalBackdrop) closeModal(); });

  saveBtn.addEventListener('click', async () => {
    const title = fieldTitle.value.trim();
    if(!title){ fieldTitle.focus(); return; }

    if(editingId){
      const card = cards.find(c => c.id === editingId);
      card.title = title;
      card.notes = fieldNotes.value.trim();
      card.status = fieldStatus.value;
      card.platform = selectedPlatform;
      await OneTakeDB.put('pauta_cards', card);
    } else {
      const card = {
        id: uid(),
        title,
        notes: fieldNotes.value.trim(),
        status: fieldStatus.value,
        platform: selectedPlatform,
        createdAt: Date.now()
      };
      cards.push(card);
      await OneTakeDB.put('pauta_cards', card);
    }
    render();
    closeModal();
  });

  deleteFromModal.addEventListener('click', () => {
    if(editingId) deleteCard(editingId);
    closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && modalBackdrop.classList.contains('show')) closeModal();
  });

  // ---------- INIT ----------
  (async function init(){
    await OneTakeMigrate();
    buildStatusOptions();
    buildPlatformPicker();
    await loadCards();
    render();
  })();
})();
</script>

</body>
</html>
