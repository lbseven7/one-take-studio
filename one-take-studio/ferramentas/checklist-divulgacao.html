<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Take Um Studio · Checklist de Divulgação</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  :root{
    --bg: #0a0a0c;
    --panel: #141417;
    --panel-line: #232328;
    --card: #1a1a1e;
    --text-main: #f5f4ef;
    --text-dim: #8a8a92;
    --accent-amber: #ffb020;
    --accent-red: #ff3b30;
    --accent-green: #39ff88;
    --accent-blue: #5aa9ff;
    --font-display: 'Archivo', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }

  #app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
    gap: 12px;
  }
  header h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .count{
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  header .count .done{ color: var(--accent-green); }

  #progress-bar{
    height: 3px;
    background: var(--panel-line);
    flex-shrink: 0;
  }
  #progress-fill{
    height: 100%;
    background: var(--accent-green);
    transition: width .3s ease;
    width: 0%;
  }

  #list{
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .section-label{
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 16px 14px 8px 14px;
    opacity: 0.8;
  }
  .section-label:first-child{ padding-top: 4px; }

  .item{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    margin-bottom: 8px;
    transition: border-color .15s ease, opacity .2s ease;
    cursor: pointer;
  }
  .item:hover{ border-color: var(--accent-amber); }
  .item.checked{ opacity: 0.55; }
  .item.checked:hover{ opacity: 0.75; }
  .item.checked .label{ text-decoration: line-through; }

  .check{
    width: 22px; height: 22px;
    border: 2px solid var(--panel-line);
    border-radius: 4px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s ease;
    background: transparent;
  }
  .item.checked .check{
    background: var(--accent-green);
    border-color: var(--accent-green);
  }
  .check svg{
    width: 12px; height: 12px;
    color: #1a1200;
    display: none;
  }
  .item.checked .check svg{ display: block; }

  .label{
    flex: 1;
    font-size: 13px;
    line-height: 1.4;
    font-family: var(--font-display);
    font-weight: 500;
    word-break: break-word;
  }

  .del-item{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 4px;
    opacity: 0;
    transition: opacity .15s ease;
    flex-shrink: 0;
  }
  .item:hover .del-item{ opacity: 1; }
  .del-item:hover{ color: var(--accent-red); }

  #add-row{
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--panel);
    border-top: 1px solid var(--panel-line);
    flex-shrink: 0;
  }
  #add-input{
    flex: 1;
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 4px;
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 11px 14px;
    outline: none;
  }
  #add-input:focus{ border-color: var(--accent-amber); }
  #add-input::placeholder{ color: #55555c; }

  #add-btn{
    background: var(--accent-amber);
    color: #1a1200;
    border: none;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 18px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  #add-btn:hover{ filter: brightness(1.1); }
  #add-btn:disabled{ background: var(--panel-line); color: var(--text-dim); cursor: not-allowed; }

  #footer-actions{
    display: flex;
    gap: 12px;
    padding: 10px 16px 14px 16px;
    flex-shrink: 0;
    justify-content: center;
  }
  #footer-actions button{
    background: none;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  #footer-actions button:hover{ color: var(--text-main); border-color: var(--accent-amber); }
  #reset-btn:hover{ border-color: var(--accent-red); color: var(--accent-red); }
  #clear-btn:hover{ border-color: var(--accent-red); color: var(--accent-red); }

  @media (max-width: 480px){
    header{ padding: 12px 14px; }
    header h1{ font-size: 14px; }
    #list{ padding: 8px 10px; }
    .item{ padding: 10px 12px; }
  }
</style>
<link rel="stylesheet" href="../mobile.css">
</head>
<body>

<div id="app">
  <header>
    <h1>Take Um Studio · Divulgação</h1>
    <div class="count"><span class="done" id="done-count">0</span> / <span id="total-count">0</span></div>
  </header>
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <div id="list"></div>

  <div id="add-row">
    <input type="text" id="add-input" placeholder="Novo item..." maxlength="120">
    <button id="add-btn" disabled>+</button>
  </div>

  <div id="footer-actions">
    <button id="reset-btn">Desmarcar todos</button>
    <button id="clear-btn">Restaurar padrão</button>
  </div>
</div>

<script src="../db.js"></script>
<script>
(function(){
  const DEFAULT_ITEMS = [
    { id: 'titulo-capa', label: 'Título, capa e descrição conferidos antes de publicar', section: 'publicar', default: true },
    { id: 'horario', label: 'Publicou no horário de pico do seu público', section: 'publicar', default: true },
    { id: 'link-bio', label: 'Link do vídeo na bio / perfil (se for o caso)', section: 'publicar', default: true },
    { id: 'stories', label: 'Compartilhou nos Stories com enquete ou adesivo', section: 'divulgar', default: true },
    { id: 'grupos', label: 'Mandou nos grupos (WhatsApp, amigos, comunidade)', section: 'divulgar', default: true },
    { id: 'teaser', label: 'Postou teaser / clipe no perfil de outra rede', section: 'divulgar', default: true },
    { id: 'fixar', label: 'Fixou comentário com pergunta para gerar conversa', section: 'divulgar', default: true },
    { id: 'responder', label: 'Respondeu os comentários das primeiras horas', section: 'responder', default: true },
    { id: 'dm', label: 'Respondeu DMs sobre o vídeo', section: 'responder', default: true },
    { id: 'agradecer', label: 'Agradeceu quem comentou / repostou / compartilhou', section: 'responder', default: true },
    { id: 'tracker', label: 'Anotou as métricas no Tracker de Resultados', section: 'acompanhar', default: true },
    { id: 'feedback', label: 'Guardou o feedback para o próximo vídeo', section: 'acompanhar', default: true }
  ];

  const SECTION_LABELS = {
    publicar: 'Publicar',
    divulgar: 'Divulgar',
    responder: 'Responder',
    acompanhar: 'Acompanhar'
  };

  const list = document.getElementById('list');
  const doneCount = document.getElementById('done-count');
  const totalCountEl = document.getElementById('total-count');
  const progressFill = document.getElementById('progress-fill');
  const addInput = document.getElementById('add-input');
  const addBtn = document.getElementById('add-btn');
  const resetBtn = document.getElementById('reset-btn');
  const resetAllBtn = document.getElementById('clear-btn');

  let items = [];

  async function loadItems(){
    try{
      const stored = await OneTakeDB.get('checklist_state', 'divulgacao');
      if(stored && Array.isArray(stored.list)){
        items = stored.list;
        return;
      }
    }catch(e){}
    items = DEFAULT_ITEMS.map(i => ({ ...i, checked: false }));
    saveItems();
  }

  async function saveItems(){
    try{ await OneTakeDB.put('checklist_state', { id: 'divulgacao', list: items }); }catch(e){}
  }

  function render(){
    list.innerHTML = '';
    let done = 0;
    let renderedSections = {};

    items.forEach(item => {
      if(item.checked) done++;

      if(!renderedSections[item.section || 'outros']){
        const secLabel = document.createElement('div');
        secLabel.className = 'section-label';
        secLabel.textContent = SECTION_LABELS[item.section || 'outros'] || 'Outros';
        list.appendChild(secLabel);
        renderedSections[item.section || 'outros'] = true;
      }

      const el = document.createElement('div');
      el.className = 'item' + (item.checked ? ' checked' : '');
      el.innerHTML = `
        <div class="check"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
        <span class="label">${escapeHtml(item.label)}</span>
        <button class="del-item" title="Remover">✕</button>
      `;

      el.addEventListener('click', (e) => {
        if(e.target.closest('.del-item')) return;
        item.checked = !item.checked;
        saveItems();
        render();
      });

      el.querySelector('.del-item').addEventListener('click', (e) => {
        e.stopPropagation();
        items = items.filter(i => i.id !== item.id);
        saveItems();
        render();
      });

      list.appendChild(el);
    });

    doneCount.textContent = done;
    totalCountEl.textContent = items.length;
    progressFill.style.width = items.length > 0 ? ((done / items.length) * 100) + '%' : '0%';
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  addInput.addEventListener('input', () => {
    addBtn.disabled = addInput.value.trim().length === 0;
  });

  addBtn.addEventListener('click', () => {
    const label = addInput.value.trim();
    if(!label) return;
    items.push({
      id: 'custom_' + Date.now() + Math.random().toString(36).slice(2,6),
      label,
      section: 'acompanhar',
      checked: false,
      default: false
    });
    addInput.value = '';
    addBtn.disabled = true;
    saveItems();
    render();
    addInput.focus();
  });

  addInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !addBtn.disabled) addBtn.click();
  });

  resetBtn.addEventListener('click', () => {
    items.forEach(i => { i.checked = false; });
    saveItems();
    render();
  });

  resetAllBtn.addEventListener('click', () => {
    if(items.length === 0) return;
    items = DEFAULT_ITEMS.map(i => ({ ...i, checked: false }));
    saveItems();
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') addInput.blur();
  });

  (async function init(){
    await OneTakeMigrate();
    await loadItems();
    render();
  })();
})();
</script>

</body>
</html>
