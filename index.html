<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OneTake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0c;
      --panel: #141417;
      --panel-line: #232328;
      --card: #1a1a1e;
      --text-main: #f5f4ef;
      --text-dim: #8a8a92;
      --accent-amber: #ffb020;
      --accent-red: #ff3b30;
      --accent-green: #39ff88;
      --accent-blue: #5aa9ff;
      --accent-purple: #c084fc;
      --font-display: 'Archivo', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    #shell {
      height: 100vh;
      height: 100dvh;
      display: flex;
    }

    /* ---------- SIDEBAR ---------- */
    #sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--panel);
      border-right: 1px solid var(--panel-line);
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      transition: transform .25s ease;
      z-index: 30;
    }

    #brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px 22px 10px;
    }

    #brand .mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-amber);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1200;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 14px;
      flex-shrink: 0;
    }

    #brand .name {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 15px;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    #brand .name small {
      display: block;
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav-item.active {
      color: var(--accent-amber);
      background: rgba(255, 176, 32, 0.08);
      border-color: rgba(255, 176, 32, 0.25);
    }

    .nav-item .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #sidebar-footer {
      margin-top: auto;
      padding: 12px 10px 4px 10px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      line-height: 1.6;
      border-top: 1px solid var(--panel-line);
    }

    #menu-toggle {
      display: none;
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 40;
      background: var(--panel);
      border: 1px solid var(--panel-line);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 6px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    /* ---------- MAIN ---------- */
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg);
    }

    #home-view,
    #tool-view {
      position: absolute;
      inset: 0;
      display: none;
    }

    #home-view.active,
    #tool-view.active {
      display: block;
    }

    #home-view {
      overflow-y: auto;
      padding: clamp(28px, 5vw, 64px);
    }

    #home-view h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(26px, 3.2vw, 38px);
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }

    #home-view .sub {
      color: var(--text-dim);
      font-size: 13px;
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 34px;
    }

    #tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      max-width: 900px;
    }

    .tool-card {
      background: var(--card);
      border: 1px solid var(--panel-line);
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      transition: border-color .15s ease, transform .15s ease;
    }

    .tool-card:hover {
      border-color: var(--accent-amber);
      transform: translateY(-2px);
    }

    .tool-card .icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 17px;
    }

    .tool-card h3 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      margin: 0 0 6px 0;
    }

    .tool-card p {
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.55;
      margin: 0;
    }

    #tool-view {
      display: none;
    }

    #tool-view.active {
      display: flex;
      flex-direction: column;
    }

    #tool-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-line);
      flex-shrink: 0;
    }

    #back-btn {
      background: none;
      border: 1px solid var(--panel-line);
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    #back-btn:hover {
      color: var(--text-main);
      border-color: var(--accent-amber);
    }

    #tool-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      color: var(--text-dim);
    }

    #tool-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: var(--bg);
    }

    @media (max-width: 860px) {
      #menu-toggle {
        display: flex;
      }

      #sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }

      #sidebar.open {
        transform: translateX(0);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }

      #home-view {
        padding-top: 70px;
      }
    }
  </style>
</head>

<body>

  <div id="shell">
    <button id="menu-toggle" aria-label="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z" />
      </svg>
    </button>

    <aside id="sidebar">
      <div id="brand">
        <div class="mark">O</div>
        <div class="name">OneTake<small>Studio</small></div>
      </div>
      <nav id="nav"></nav>
      <div id="sidebar-footer">OneTake · Seus dados ficam salvos só neste navegador.</div>
    </aside>

    <main id="main">
      <div id="home-view" class="active">
        <h1>OneTake</h1>
        <div class="sub"><STRong>Ferramentas pensadas pra quem grava e organiza vídeo sozinho: leia seu roteiro sem decorar,
          planeje suas pautas e marque seus takes como numa produção de verdade. SIMPLES E DIRETO!</STRong></div>
        <div id="tool-grid"></div>
      </div>

      <div id="tool-view">
        <div id="tool-topbar">
          <button id="back-btn">← Início</button>
          <span id="tool-name"></span>
        </div>
        <iframe id="tool-frame" allow="camera; microphone; fullscreen" src="about:blank"></iframe>
      </div>
    </main>
  </div>

  <script src="db.js"></script>
  <script>
    (function () {
      const TOOLS = [
        {
          id: 'teleprompter',
          file: 'teleprompter.html',
          name: 'Teleprompter',
          desc: 'Leia seu roteiro rolando na tela enquanto grava, com câmera embutida e gravação direto do navegador.',
          color: 'var(--accent-amber)',
          icon: '▤'
        },
        {
          id: 'pauta',
          file: 'painel-pauta.html',
          name: 'Painel de Pauta',
          desc: 'Organize suas ideias de vídeo num quadro por etapas: ideia, roteiro, gravado, editado e postado.',
          color: 'var(--accent-blue)',
          icon: '◫'
        },
        {
          id: 'claquete',
          file: 'claquete-digital.html',
          name: 'Claquete Digital',
          desc: 'Contagem regressiva, bate-claquete com som e cronômetro de take, com histórico de gravações.',
          color: 'var(--accent-purple)',
          icon: '◧'
        },
        {
          id: 'checklist',
          file: 'checklist-gravacao.html',
          name: 'Checklist',
          desc: 'Checklist pré-gravação: nunca mais esqueça bateria, microfone, luz, isolamento e muito mais.',
          color: 'var(--accent-green)',
          icon: '✓'
        }
      ];

      const nav = document.getElementById('nav');
      const toolGrid = document.getElementById('tool-grid');
      const homeView = document.getElementById('home-view');
      const toolView = document.getElementById('tool-view');
      const toolFrame = document.getElementById('tool-frame');
      const toolName = document.getElementById('tool-name');
      const backBtn = document.getElementById('back-btn');
      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menu-toggle');

      // Build sidebar nav
      const homeNavItem = document.createElement('div');
      homeNavItem.className = 'nav-item active';
      homeNavItem.dataset.id = 'home';
      homeNavItem.innerHTML = '<span class="dot" style="background:var(--text-dim)"></span>Início';
      homeNavItem.addEventListener('click', () => openHome());
      nav.appendChild(homeNavItem);

      TOOLS.forEach(tool => {
        const item = document.createElement('div');
        item.className = 'nav-item';
        item.dataset.id = tool.id;
        item.innerHTML = `<span class="dot" style="background:${tool.color}"></span>${tool.name}`;
        item.addEventListener('click', () => openTool(tool));
        nav.appendChild(item);
      });

      // Build home cards
      TOOLS.forEach(tool => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
      <div class="icon" style="background:${tool.color}22; color:${tool.color};">${tool.icon}</div>
      <h3>${tool.name}</h3>
      <p>${tool.desc}</p>
    `;
        card.addEventListener('click', () => openTool(tool));
        toolGrid.appendChild(card);
      });

      function setActiveNav(id) {
        [...nav.children].forEach(el => el.classList.toggle('active', el.dataset.id === id));
      }

      function openHome() {
        homeView.classList.add('active');
        toolView.classList.remove('active');
        toolFrame.src = 'about:blank';
        setActiveNav('home');
        closeSidebarOnMobile();
      }

      function openTool(tool) {
        toolFrame.src = tool.file;
        toolName.textContent = tool.name;
        homeView.classList.remove('active');
        toolView.classList.add('active');
        setActiveNav(tool.id);
        closeSidebarOnMobile();
      }

      backBtn.addEventListener('click', openHome);

      menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
      function closeSidebarOnMobile() {
        if (window.innerWidth <= 860) sidebar.classList.remove('open');
      }
    })();
  </script>

</body>

</html>
