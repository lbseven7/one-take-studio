<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Take Um Studio · Leads</title>
<link rel="stylesheet" href="../fonts.css">
<style>
  :root{
    --bg: #0a0a0c;
    --panel: #141417;
    --panel-line: #232328;
    --card: #1a1a1e;
    --text-main: #f5f4ef;
    --text-dim: #8a8a92;
    --accent-amber: #ffb020;
    --accent-red: #ff3b30;
    --accent-green: #39ff88;
    --font-display: 'Archivo', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin: 0; padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text-main);
    font-family: var(--font-mono);
  }

  #app{
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--panel-line);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  header h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 16px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .actions{ display: flex; gap: 8px; align-items: center; }
  header button{
    background: none;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  header button:hover{ color: var(--text-main); border-color: var(--accent-amber); }
  header button:disabled{ opacity: .5; cursor: default; }

  #content{
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 8px;
    padding: 20px;
  }
  .card h2{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    margin: 0 0 4px 0;
  }
  .card .sub{
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.6;
    margin: 0 0 16px 0;
  }

  .stats{ display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat{
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 6px;
    padding: 12px 16px;
    min-width: 110px;
  }
  .stat .num{
    display: block;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    color: var(--accent-amber);
  }
  .stat .label{
    display: block;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 2px;
  }

  #msg{ font-size: 12px; min-height: 18px; margin-bottom: 12px; }
  #msg.ok{ color: var(--accent-green); }
  #msg.err{ color: var(--accent-red); }

  table{ width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td{
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid var(--panel-line);
    vertical-align: middle;
  }
  th{
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }
  td.email{ font-weight: 600; color: var(--text-main); word-break: break-all; }
  td .tag{
    display: inline-block;
    background: var(--card);
    border: 1px solid var(--panel-line);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--text-dim);
  }
  td .del{
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 13px;
    padding: 4px;
  }
  td .del:hover{ color: var(--accent-red); }

  #empty{
    display: none;
    text-align: center;
    color: var(--text-dim);
    padding: 30px 0;
    font-size: 13px;
    line-height: 1.6;
  }
  #empty .big{ display: block; font-size: 26px; margin-bottom: 6px; }

  @media (max-width: 480px){
    header{ padding: 12px 14px; }
    header h1{ font-size: 14px; }
    #content{ padding: 14px; }
    .card{ padding: 16px; }
    th:nth-child(3), td:nth-child(3){ display: none; }
  }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Take Um Studio · Leads</h1>
    <div class="actions">
      <button id="refresh-btn">↻ Atualizar</button>
      <button id="csv-btn">⬇ CSV</button>
    </div>
  </header>

  <div id="content">
    <div class="card">
      <h2>E-mails capturados</h2>
      <p class="sub">Leads salvos no banco deste navegador (app_state · leads). Só mostra o que foi coletado nesta máquina.</p>

      <div class="stats">
        <div class="stat"><span class="num" id="stat-total">0</span><span class="label">total</span></div>
        <div class="stat"><span class="num" id="stat-today">0</span><span class="label">hoje</span></div>
      </div>

      <div id="msg"></div>

      <table id="lead-table">
        <thead>
          <tr><th>E-mail</th><th>Origem</th><th>Capturado em</th><th></th></tr>
        </thead>
        <tbody id="lead-body"></tbody>
      </table>

      <div id="empty"><span class="big">📭</span>Nenhum lead capturado ainda.<br>Eles aparecem aqui quando alguém deixa o e-mail no aviso de limite.</div>
    </div>
  </div>
</div>

<script src="../db.js"></script>
<script src="../limite.js"></script>
<script>
(function(){
  const tbody = document.getElementById('lead-body');
  const table = document.getElementById('lead-table');
  const empty = document.getElementById('empty');
  const msg = document.getElementById('msg');
  const statTotal = document.getElementById('stat-total');
  const statToday = document.getElementById('stat-today');
  const refreshBtn = document.getElementById('refresh-btn');
  const csvBtn = document.getElementById('csv-btn');
  let leads = [];

  function setMsg(text, type){
    msg.textContent = text;
    msg.className = type || '';
  }

  function fmtDate(iso){
    try{
      return new Date(iso).toLocaleString('pt-BR', {
        day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit'
      });
    }catch(e){ return iso || '—'; }
  }

  function acaoLabel(acao){
    if(window.TakeUmLimite && TakeUmLimite.ACOES[acao]) return TakeUmLimite.ACOES[acao];
    return acao || '—';
  }

  function render(){
    leads.sort((a, b) => new Date(b.capturadoEm || 0) - new Date(a.capturadoEm || 0));
    statTotal.textContent = leads.length;
    const now = new Date();
    const today = leads.filter(l => {
      try{ return new Date(l.capturadoEm).toDateString() === now.toDateString(); }
      catch(e){ return false; }
    }).length;
    statToday.textContent = today;

    tbody.innerHTML = '';
    leads.forEach(lead => {
      const tr = document.createElement('tr');

      const tdEmail = document.createElement('td');
      tdEmail.className = 'email';
      tdEmail.textContent = lead.email || '—';

      const tdAcao = document.createElement('td');
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = acaoLabel(lead.acao);
      tdAcao.appendChild(tag);

      const tdDate = document.createElement('td');
      tdDate.textContent = fmtDate(lead.capturadoEm);

      const tdDel = document.createElement('td');
      const del = document.createElement('button');
      del.className = 'del';
      del.title = 'Excluir lead';
      del.textContent = '✕';
      del.addEventListener('click', () => removeLead(lead));
      tdDel.appendChild(del);

      tr.appendChild(tdEmail);
      tr.appendChild(tdAcao);
      tr.appendChild(tdDate);
      tr.appendChild(tdDel);
      tbody.appendChild(tr);
    });

    const has = leads.length > 0;
    table.style.display = has ? 'table' : 'none';
    empty.style.display = has ? 'none' : 'block';
  }

  async function load(){
    refreshBtn.disabled = true;
    try{
      leads = await TakeUmLeads.listar();
      render();
      setMsg('', '');
    }catch(e){
      setMsg('Não consegui ler os leads: ' + e.message, 'err');
    }finally{
      refreshBtn.disabled = false;
    }
  }

  async function removeLead(lead){
    if(!confirm('Excluir ' + lead.email + '?')) return;
    try{
      const rec = (await OneTakeDB.get('app_state', 'leads')) || { id: 'leads', lista: [] };
      rec.lista = (rec.lista || []).filter(l => !(l.email === lead.email && l.capturadoEm === lead.capturadoEm));
      await OneTakeDB.put('app_state', rec);
      await load();
      setMsg('Lead excluído.', 'ok');
    }catch(e){
      setMsg('Não consegui excluir: ' + e.message, 'err');
    }
  }

  function toCSV(){
    const rows = [['E-mail', 'Origem', 'Capturado em']];
    leads.forEach(l => {
      rows.push([l.email || '', acaoLabel(l.acao), l.capturadoEm || '']);
    });
    return rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  }

  csvBtn.addEventListener('click', () => {
    if(!leads.length){ setMsg('Nada para exportar ainda.', 'err'); return; }
    const blob = new Blob(['\ufeff' + toCSV()], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'takeum-leads.csv';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
    setMsg('CSV exportado com ' + leads.length + ' lead(s).', 'ok');
  });

  refreshBtn.addEventListener('click', load);

  (async function init(){
    await OneTakeMigrate();
    await load();
  })();
})();
</script>

</body>
</html>
